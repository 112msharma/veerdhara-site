name: Localise assets

on:
  workflow_dispatch:
  push:
    paths:
      - veerdhara.html
      - localize_assets.py

permissions:
  contents: write

jobs:
  localise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos and menus, build index.html
        run: python3 localize_assets.py
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add index.html images menus
          if ! git diff --cached --quiet; then
            git commit -m "Localise assets"
            git push
          fi
